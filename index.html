<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="author" content="Михаил Пирогов, PirogovLab">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a2c48">
<meta name="description" content="Кыв кытш — словесная головоломка на коми языке">
<title>Кыв кытш — коми слова</title>
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="css/style.css?v=20261019d">
</head>
<body>
<div id="bg"></div><div id="bgShade"></div>
<div id="app">
  <!-- HOME -->
  <section id="scrHome" class="screen">
    <div class="topbar">
      <button class="iconbtn" id="hSettings" aria-label="settings">⚙️</button>
      <button class="iconbtn" id="hMusic" aria-label="music">🎵</button>
      <div class="pill streak" id="hStreak">🔥 <b>0</b></div>
      <div class="pill coins" id="hCoins"><i class="coin"></i><b>0</b></div>
    </div>
    <div class="logo">
      <div class="logo-orn"></div>
      <h1 id="tTitle">Кыв кытш</h1>
      <div class="logo-sub" id="tSub">Мир коми слов</div>
    </div>
    <div class="homeMain">
      <button class="playbtn" id="hPlay"><span id="hPlayTxt">Играть</span><small id="hPlayLvl">Уровень 1</small></button>
      <div class="chapterline" id="hChapter"></div>
    </div>
    <div class="tiles" id="hTiles"></div>
    <a class="brand" id="hBrand" href="https://pirogovlab.ru" target="_blank" rel="noopener">Проект PirogovLab · pirogovlab.ru</a>
  </section>
  <!-- MAP -->
  <section id="scrMap" class="screen">
    <div class="topbar">
      <button class="iconbtn" id="mBack">‹</button>
      <div class="ttl" id="mTitle">Карта</div>
      <div class="pill coins"><i class="coin"></i><b class="coinsVal">0</b></div>
    </div>
    <div class="maplist" id="mList"></div>
  </section>
  <!-- GAME -->
  <section id="scrGame" class="screen">
    <div class="topbar">
      <button class="iconbtn" id="gBack">‹</button>
      <div class="ttl"><span id="gTitle">Уровень 1</span><small id="gSub"></small></div>
      <div class="pill coins" id="gCoins"><i class="coin"></i><b class="coinsVal">0</b></div>
    </div>
    <div class="prog"><i id="gProg"></i></div>
    <div id="gridWrap"><div id="grid"></div></div>
    <div id="preview"><span id="word"></span></div>
    <div id="bottom">
      <div class="side l">
        <button class="gbtn" id="bShuffle" aria-label="shuffle">⟳</button>
        <button class="gbtn" id="bJar" aria-label="bonus">🏺<span class="badge" id="jarBadge">0</span><svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" id="jarRing"/></svg></button>
      </div>
      <div id="wheel"><div class="wheelOrn" aria-hidden="true"><div class="ornB"><svg class="ornP" viewBox="-10 -10 20 20" focusable="false"><g fill="currentColor"><path d="M0 -8 L8 0 L0 8 L-8 0 Z M0 -5 L-5 0 L0 5 L5 0 Z" fill-rule="evenodd"/><path d="M0 -2.4 L2.4 0 L0 2.4 L-2.4 0 Z"/><path d="M-8 0 h-1.6 v-3 h1 M8 0 h1.6 v-3 h-1 M-8 0 h-1.6 v3 h1 M8 0 h1.6 v3 h-1 M0 -8 v-1.6 h-3 v1 M0 -8 v-1.6 h3 v1 M0 8 v1.6 h-3 v-1 M0 8 v1.6 h3 v-1" stroke="currentColor" stroke-width=".7" fill="none"/></g></svg></div></div><svg id="lines"></svg></div>
      <div class="side r">
        <button class="gbtn" id="bHint" aria-label="hint">💡<small><i class="coin"></i><span id="hintCost">25</span></small><span class="badge free" id="freeBadge" hidden>0</span></button>
        <button class="gbtn" id="bWord" aria-label="word">🎯<small><i class="coin"></i>60</small></button>
        <button class="gbtn ad" id="bAd" aria-label="Подсказка за рекламу" title="Подсказка за рекламу" hidden>🎬<small>+💡</small></button>
      </div>
    </div>
  </section>
</div>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="cardModal" class="modal" hidden><div class="sheet wcard" id="cardSheet"></div></div>
<div id="toast"></div>
<div id="combo"></div>
<div id="fly"></div>
<canvas id="fx"></canvas>
<script>window.BUILD_V='20261019d';</script>
<script src="js/platform.js?v=20261019d"></script>
<script src="js/ads-config.js?v=20261019d"></script>
<script src="js/adapters/web.js?v=20261019d"></script>
<script src="js/sound.js?v=20261019d"></script>
<script src="js/tracks.js?v=20261019d"></script>
<script src="js/music.js?v=20261019d"></script>
<script src="js/i18n.js?v=20261019d"></script>
<script src="js/art.js?v=20261019d"></script>
<script src="js/bgimages.js?v=20261019d"></script>
<script src="data/levels.js?v=20261019d"></script>
<script src="js/app.js?v=20261019d"></script>
</body>
</html>
